apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb-p5      # fix, ca dashboardul provizionat sa-l poata referi
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: proiect5
      defaultBucket: iot_data
    secureJsonData:
      token: token_secret_proiect5